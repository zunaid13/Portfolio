  <text x="842" y="372" font-size="9.3" fill="#334155">• <tspan font-weight="700" fill="#0E9AA7">8x Token Efficiency:</tspan> <tspan font-family="monospace">B5</tspan> uses <tspan font-weight="700">951</tspan> input tokens</text>
